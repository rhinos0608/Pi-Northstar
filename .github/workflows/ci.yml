name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --import tsx --test --test-timeout=30000 "test/**/*.test.ts"
        # Pin bash on all three OS: the quoted glob must reach node's own
        # glob expansion unexpanded (pwsh/cmd would split or expand it).
        shell: bash
      - run: npm pack --dry-run --json
