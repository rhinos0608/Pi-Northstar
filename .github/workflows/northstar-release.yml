name: northstar-release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Required CI Secrets for Code Signing & Notarization:
# Windows:
#   - WINDOWS_CERT_BASE64: Base64-encoded PFX certificate for Authenticode code signing
#   - WINDOWS_CERT_PASSWORD: Password for the PFX certificate
# macOS:
#   - MACOS_CERT_P12_BASE64: Base64-encoded Developer ID Application and Installer .p12 certificate
#   - MACOS_CERT_PASSWORD: Password for the .p12 certificate
#   - NOTARY_APPLE_ID: Apple ID email for xcrun notarytool
#   - NOTARY_APP_PASSWORD: App-specific password for notarytool
#   - MACOS_SIGN_IDENTITY_APP: Full Developer ID Application signing identity (e.g. "Developer ID Application: Team Name (TEAMID)")
#   - MACOS_SIGN_IDENTITY_INSTALLER: Full Developer ID Installer signing identity (e.g. "Developer ID Installer: Team Name (TEAMID)")
#   - NOTARY_TEAM_ID: 10-character Apple Developer Team ID (notarytool --team-id only)
#
# Signing steps run whenever certificate secrets are present (on pushes, pull requests, and tags).
# Only macOS notarization and stapling (xcrun notarytool) is gated on git release tags (refs/tags/v*).

jobs:
  windows-msi:
    # The current Rust broker is Unix-socket based. Do not publish an MSI until
    # the named-pipe/Windows-service implementation exists and is explicitly enabled.
    if: ${{ vars.NORTHSTAR_ENABLE_WINDOWS_MSI == '1' }}
    name: Build & Package Windows MSI
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WiX Toolset v4
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6

      - name: Build northstar-broker binary
        shell: pwsh
        run: |
          cargo build --release --package northstar-broker --manifest-path rust/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Sign executable (if secrets available)
        shell: pwsh
        id: sign-exe
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64 -and $env:WINDOWS_CERT_PASSWORD) {
            Write-Host "Decoding signing certificate..."
            [IO.File]::WriteAllBytes("$pwd\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found under Windows Kits 10 bin." }
            & $signtool sign /f "$pwd\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "rust/target/x86_64-pc-windows-msvc/release/northstar-broker.exe"
            Remove-Item "$pwd\cert.pfx" -Force
            Write-Host "Binary signed successfully."
          } else {
            Write-Host "Signing secrets missing or not configured. Building unsigned binary."
          }

      - name: Package MSI with WiX v4
        shell: pwsh
        run: |
          $cargoMetadata = cargo metadata --format-version 1 --manifest-path rust/Cargo.toml | ConvertFrom-Json
          $brokerPkg = $cargoMetadata.packages | Where-Object { $_.name -eq "northstar-broker" }
          $version = $brokerPkg.version
          Write-Host "Building MSI for version $version"
          New-Item -ItemType Directory -Force -Path dist
          $binaryPath = Resolve-Path "rust/target/x86_64-pc-windows-msvc/release/northstar-broker.exe"
          wix build -arch x64 -d CargoVersion="$version" -d BinaryPath="$binaryPath" -o dist/northstar-broker.msi ./installer/broker.wxs

      - name: Sign MSI (if secrets available)
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64 -and $env:WINDOWS_CERT_PASSWORD) {
            Write-Host "Signing MSI..."
            [IO.File]::WriteAllBytes("$pwd\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found under Windows Kits 10 bin." }
            & $signtool sign /f "$pwd\cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "dist/northstar-broker.msi"
            Remove-Item "$pwd\cert.pfx" -Force
            Write-Host "MSI signed successfully."
          } else {
            Write-Host "Signing secrets missing. Outputting unsigned MSI."
          }

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: northstar-broker-windows-msi
          path: dist/northstar-broker.msi

  macos-pkg:
    name: Build & Package macOS PKG
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build northstar-broker binary
        run: |
          cargo build --release --package northstar-broker --manifest-path rust/Cargo.toml

      - name: Prepare Packaging Payload
        run: |
          mkdir -p dist/payload/usr/local/bin
          mkdir -p dist/payload/Library/LaunchDaemons
          mkdir -p dist/scripts
          cp rust/target/release/northstar-broker dist/payload/usr/local/bin/
          cp installer/macos/com.pi.northstar.broker.plist dist/payload/Library/LaunchDaemons/
          cp installer/macos/pkg-scripts/postinstall dist/scripts/
          chmod 0755 dist/scripts/postinstall
          chmod 0755 dist/payload/usr/local/bin/northstar-broker

      - name: Setup macOS Keychain & Import Certificates (if secrets available)
        id: macos-certs
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERT_P12_BASE64" ] && [ -n "$MACOS_CERT_PASSWORD" ]; then
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PWD=$(uuidgen)
            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            
            CERT_P12=$RUNNER_TEMP/cert.p12
            echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_P12"
            security import "$CERT_P12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            rm -f "$CERT_P12"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
            echo "has_certs=true" >> $GITHUB_OUTPUT
          else
            echo "macOS cert secrets missing. Will produce unsigned component/product."
            echo "has_certs=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign Binary (if secrets available)
        env:
          MACOS_SIGN_IDENTITY_APP: ${{ secrets.MACOS_SIGN_IDENTITY_APP }}
        run: |
          if [ "${{ steps.macos-certs.outputs.has_certs }}" = "true" ] && [ -n "$MACOS_SIGN_IDENTITY_APP" ]; then
            echo "Signing binary with Developer ID Application..."
            codesign --force --options runtime --entitlements installer/macos/helper.entitlements --sign "$MACOS_SIGN_IDENTITY_APP" dist/payload/usr/local/bin/northstar-broker
          else
            echo "Skipping codesign (missing certs or signing identity)."
          fi

      - name: Build Component PKG and Product PKG
        env:
          MACOS_SIGN_IDENTITY_INSTALLER: ${{ secrets.MACOS_SIGN_IDENTITY_INSTALLER }}
        run: |
          VERSION=$(cargo metadata --format-version 1 --manifest-path rust/Cargo.toml | python3 -c "import sys, json; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name'] == 'northstar-broker'))")
          echo "Building PKG for northstar-broker version $VERSION"
          pkgbuild --root dist/payload --scripts dist/scripts --identifier com.pi.northstar.broker --version "$VERSION" dist/northstar-broker-component.pkg
          sed -i '' -e "/<pkg-ref /s/version=\"[^\"]*\"/version=\"$VERSION\"/" installer/macos/Distribution.xml
          
          if [ "${{ steps.macos-certs.outputs.has_certs }}" = "true" ] && [ -n "$MACOS_SIGN_IDENTITY_INSTALLER" ]; then
            echo "Signing installer with Developer ID Installer..."
            productbuild --distribution installer/macos/Distribution.xml --package-path dist --sign "$MACOS_SIGN_IDENTITY_INSTALLER" dist/northstar-broker.pkg
          else
            echo "Building unsigned installer package..."
            productbuild --distribution installer/macos/Distribution.xml --package-path dist dist/northstar-broker.pkg
          fi

      - name: Notarize and Staple (if notary secrets available and release tag)
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_APP_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "Submitting package to Apple Notary Service..."
            xcrun notarytool submit dist/northstar-broker.pkg --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_APP_PASSWORD" --team-id "$NOTARY_TEAM_ID" --wait
            echo "Stapling notarization ticket..."
            xcrun stapler staple dist/northstar-broker.pkg
            spctl --assess --type install dist/northstar-broker.pkg
            echo "Notarization and stapling complete."
          else
            echo "Skipping notarytool submission (secrets missing or not a tag release)."
          fi

      - name: Upload macOS PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: northstar-broker-macos-pkg
          path: dist/northstar-broker.pkg

  linux-tarball:
    name: Build & Package Linux Tarball
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build northstar-broker binary
        run: |
          cargo build --release --package northstar-broker --manifest-path rust/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Package Linux Tarball with Systemd Unit
        run: |
          mkdir -p dist/staging/bin
          mkdir -p dist/staging/systemd
          cp rust/target/x86_64-unknown-linux-gnu/release/northstar-broker dist/staging/bin/
          cp installer/systemd/northstar-broker.service dist/staging/systemd/
          chmod 0755 dist/staging/bin/northstar-broker
          tar -czf dist/northstar-broker-linux-x64.tar.gz -C dist/staging bin systemd

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: northstar-broker-linux-tarball
          path: dist/northstar-broker-linux-x64.tar.gz
