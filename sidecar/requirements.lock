# Hash-verified lock for the embedding sidecar: full transitive closure of
# sidecar/requirements.in with sha256 digests from the PyPI JSON API.
# Regenerate after any pin bump in requirements.in:
#   1. pip install -r sidecar/requirements.in into a clean Python 3.11 env
#   2. walk importlib.metadata Requires from the direct deps (skip markers
#      failing with extra==""), freezing installed versions
#   3. fetch each pin's file hashes from https://pypi.org/pypi/<name>/<ver>/json
#      and emit `pkg==ver` + `--hash=sha256:...` lines (all published files)
#   4. verify: pip install --require-hashes --dry-run -r sidecar/requirements.lock
#
# Install with hash checking:
#   pip install --require-hashes -r sidecar/requirements.lock
#
# Torch CPU note: the torch hashes below cover the default-PyPI (CUDA-bundled)
# wheels. On Linux CI installs torch==2.13.0 from the CPU index FIRST
# (see sidecar-ci job); pip then sees the pin satisfied and skips the CUDA wheel,
# so the CPU wheel is used and no hash mismatch occurs. Installing this lock
# standalone pulls the default-PyPI torch wheel (large, CUDA-bundled, CPU-usable).

